name: Build Release Binaries

on:
  workflow_dispatch:
    inputs:
      allow_overwrite:
        description: 'Allow overwriting a finalized release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: build-release
  cancel-in-progress: false

env:
  SKIP_NVM_SETUP: "1"
  INSTALL_PLATFORM_PREREQS: "1"

jobs:
  authorize:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Authorize Trigger
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Ensure triggering actor is allowed
        env:
          ACTOR: ${{ github.triggering_actor }}
          ALLOWED_ACTORS: ${{ vars.RELEASE_BUILD_ADMINS || github.repository_owner }}
        run: |
          set -euo pipefail
          IFS=',' read -ra allowed_list <<< "$ALLOWED_ACTORS"
          authorized=false
          for user in "${allowed_list[@]}"; do
            trimmed="$(echo "$user" | xargs)"
            [ -z "$trimmed" ] && continue
            if [ "$ACTOR" = "$trimmed" ]; then
              authorized=true
              break
            fi
          done
          if [ "$authorized" != "true" ]; then
            echo "Current actor: $ACTOR" >&2
            echo "This workflow may only be triggered by: $ALLOWED_ACTORS" >&2
            exit 1
          fi
          echo "Authorized actor: $ACTOR"

      - name: Checkout sources
        uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Check for finalized release
        if: ${{ !inputs.allow_overwrite }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="release/${VERSION}"
          echo "Checking for existing release with tag: $TAG_NAME"

          # Treat the release as finalized if either:
          #   - it has been published (isDraft=false)  → publish-release.yml has promoted it
          #   - the body has been customized away from the 'TBD' placeholder → description generated
          # Asset presence alone is NOT a finalization signal: a build in progress (or a
          # previous build that failed mid-upload) leaves assets attached while body=TBD
          # and draft=true, and that state should be safely overwritable without forcing
          # the operator to set allow_overwrite=true (which would weaken the check
          # everywhere else through habituation).
          RELEASE_JSON=$(gh release view "$TAG_NAME" --json isDraft,body 2>/dev/null || true)
          if [ -n "$RELEASE_JSON" ]; then
            IS_DRAFT=$(echo "$RELEASE_JSON" | jq -r '.isDraft')
            BODY=$(echo "$RELEASE_JSON" | jq -r '.body // ""')
            if [ "$IS_DRAFT" = "false" ] \
              || { [ -n "$BODY" ] && [ "$BODY" != "TBD" ]; } ; then
              echo "::error::Release $TAG_NAME already exists and appears finalized (isDraft=$IS_DRAFT, body starts with: $(echo "$BODY" | head -c 40)). Set 'allow_overwrite' to true to overwrite it."
              exit 1
            fi
          fi

          echo "No finalized release found for $TAG_NAME, proceeding."

  macos:
    name: Build macOS
    needs: authorize
    runs-on: macos-26
    environment: Build Deploy
    permissions:
      contents: write
    env:
      APPLE_KEYCHAIN_PROFILE: ${{ vars.APPLE_KEYCHAIN_PROFILE || 'Unbroken Notary' }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install signing certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERTIFICATE_BASE64" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ] || [ -z "$MACOS_KEYCHAIN_PASSWORD" ]; then
            echo "macOS signing secrets are missing. Configure MACOS_CERTIFICATE_BASE64, MACOS_CERTIFICATE_PASSWORD, and MACOS_KEYCHAIN_PASSWORD." >&2
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/signing-cert.p12"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          KEYCHAIN_PATH="$RUNNER_TEMP/unbroken-signing.keychain-db"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          existing_keychains=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $existing_keychains
          rm -f "$CERT_PATH"
          echo "MACOS_CODESIGN_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Configure notarization credentials
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_NOTARIZE_APP_PASSWORD }}
          APPLE_KEYCHAIN_PROFILE: ${{ env.APPLE_KEYCHAIN_PROFILE }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APP_SPECIFIC_PASSWORD" ]; then
            echo "macOS notarization secrets are missing. Configure MACOS_NOTARIZE_APPLE_ID, MACOS_NOTARIZE_TEAM_ID, and MACOS_NOTARIZE_APP_PASSWORD." >&2
            exit 1
          fi
          if [ -z "${MACOS_CODESIGN_KEYCHAIN:-}" ] || [ ! -f "$MACOS_CODESIGN_KEYCHAIN" ]; then
            echo "Signing keychain not available for notarization credential storage." >&2
            exit 1
          fi
          if xcrun notarytool list-profiles --keychain "$MACOS_CODESIGN_KEYCHAIN" | grep -F "Name: $APPLE_KEYCHAIN_PROFILE" >/dev/null 2>&1; then
            echo "Notarization profile '$APPLE_KEYCHAIN_PROFILE' already present"
          else
            xcrun notarytool store-credentials "$APPLE_KEYCHAIN_PROFILE" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APP_SPECIFIC_PASSWORD" \
              --keychain "$MACOS_CODESIGN_KEYCHAIN"
            echo "Stored notarization profile '$APPLE_KEYCHAIN_PROFILE'"
          fi

      - name: Build binaries
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./setup.sh
          ./build-unbroken-code.sh --macos --release
        shell: bash

      - name: Remove temporary keychain
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${MACOS_CODESIGN_KEYCHAIN:-}" ] && [ -f "$MACOS_CODESIGN_KEYCHAIN" ]; then
            security delete-keychain "$MACOS_CODESIGN_KEYCHAIN" || true
          fi
        shell: bash

  windows_x64:
    name: Build Windows x64
    needs:
      - authorize
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./setup.sh
          ./build-unbroken-code.sh --windows --windows-arch=x64 --release
        shell: bash

  windows_arm64:
    name: Build Windows arm64
    needs:
      - authorize
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./setup.sh
          ./build-unbroken-code.sh --windows --windows-arch=arm64 --release
        shell: bash

  linux_x64:
    name: Build Linux x64
    needs:
      - authorize
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Maximize disk space 1
        shell: bash
        run: |
          df -h --sync
          swapon --show
          pwd
          sudo mkdir -p /mnt/workspace
          sudo chown "$USER" /mnt/workspace
          sudo mount --bind /mnt/workspace "$PWD"
          ls -laF .
          df -h .

      - name: Checkout sources
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure rust
        run: |
          set -euo pipefail
          rustup install 1.89.0
          rustup default 1.89.0
        shell: bash

      - name: Build binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./setup.sh
          ./build-unbroken-code.sh --linux --release
        shell: bash

  linux_arm64:
    name: Build Linux arm64
    needs:
      - authorize
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: write
    steps:
      - name: Maximize disk space 1
        shell: bash
        run: |
          df -h --sync
          swapon --show
          pwd
          sudo mkdir -p /mnt/workspace
          sudo chown "$USER" /mnt/workspace
          sudo mount --bind /mnt/workspace "$PWD"
          ls -laF .
          df -h .

      - name: Checkout sources
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure rust
        run: |
          set -euo pipefail
          rustup install 1.89.0
          rustup default 1.89.0
        shell: bash

      - name: Build binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./setup.sh
          ./build-unbroken-code.sh --linux --release
        shell: bash

  release_description:
    name: Generate Release Description
    needs:
      - macos
      - windows_x64
      - windows_arm64
      - linux_x64
      - linux_arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/microsoft/vscode.git
          git fetch --all
        shell: bash

      - name: Generate description
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./setup.sh
          (cd build && npm ci)
          ./build-unbroken-code.sh --generate-release-description
        shell: bash
